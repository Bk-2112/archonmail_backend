resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name webmail.aeroverra.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name webmail.aeroverra.com;
    ssl_certificate /etc/ssl/certs/aeromail.crt;
    ssl_certificate_key /etc/ssl/private/aeromail.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        set $upstream_api http://api:5000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location / {
        set $upstream_web http://web:80;
        proxy_pass $upstream_web;
        proxy_set_header Host $host;
    }
}
