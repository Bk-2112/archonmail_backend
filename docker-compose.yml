services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeromail
      POSTGRES_USER: aeromail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aeromail_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeromail"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: ./aeromail-api
    environment:
      ConnectionStrings__Default: "Host=db;Database=aeromail;Username=aeromail;Password=${DB_PASSWORD:-aeromail_dev}"
      Jwt__Secret: ${JWT_SECRET:-dev_secret_change_in_production}
      Jwt__Issuer: ${JWT_ISSUER:-aeromail}
      Jwt__Audience: ${JWT_AUDIENCE:-aeromail-users}
      Aes__Key: ${AES_KEY:-CHANGE_THIS_32_BYTE_AES_KEY_____}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
  web:
    build: ./aeromail-web
    ports:
      - "3000:80"
    # White-label: inject branding by adding a sub_filter in your nginx config or
    # by mounting a custom index.html with a <script> block that sets:
    #   window.AEROMAIL_CONFIG = { appName: 'MyMail', primaryColor: '#ff6600', accentColor: '#cc4400', logoText: 'MyMail' }
    # Example nginx sub_filter (in proxy.conf):
    #   sub_filter '</body>' '<script>window.AEROMAIL_CONFIG={"appName":"MyMail","primaryColor":"#ff6600"}</script></body>';
    #   sub_filter_once on;
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl/aeromail.crt:/etc/ssl/certs/aeromail.crt:ro
      - ./nginx/ssl/aeromail.key:/etc/ssl/private/aeromail.key:ro
    depends_on:
      - api
      - web
volumes:
  postgres_data:
